opencollection: 1.0.0

info:
  name: API Management
config:
  proxy:
    inherit: true
    config:
      protocol: http
      hostname: ""
      port: ""
      auth:
        username: ""
        password: ""
      bypassProxy: ""

request:
  headers:
    - name: Accept
      value: application/json
  auth:
    type: bearer
    token: "{{TOKEN}}"
  scripts:
    - type: after-response
      code: |-
        const { access_token } = res.getBody()

        if (access_token) {
          bru.setEnvVar('TOKEN', access_token)
        }
bundled: false
extensions:
  bruno:
    ignore:
      - node_modules
      - .git
