info:
  name: /login
  type: http
  seq: 1

http:
  method: POST
  url: "{{URL}}{{AUTH_SERVICE_PATH}}/login"
  body:
    type: multipart-form
    data:
      - name: email
        type: text
        value: john@example.com
      - name: email
        type: text
        value: jane@example.com
        disabled: true
      - name: email
        type: text
        value: tim@example.com
        disabled: true
      - name: email
        type: text
        value: lin@example.com
        disabled: true
      - name: password
        type: text
        value: password

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
